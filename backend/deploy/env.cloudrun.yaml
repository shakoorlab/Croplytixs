# Environment for the Cloud Run service. Passed with:
#   gcloud run deploy croplytix-api --env-vars-file deploy/env.cloudrun.yaml ...
#
# Same variable names as .env.example — only the values differ. A YAML file is
# used instead of --set-env-vars because that flag splits on commas, and
# CORS_ORIGINS may need commas.
#
# Every value must be a YAML *string*; quote anything that looks like a number.
# Replace the two REPLACE_ME values before deploying.

STORAGE_BACKEND: "gcs"
DB_BACKEND: "firestore"

GCP_PROJECT: "not-croplytixs"
GCS_BUCKET: "croplytix-not-croplytixs-uploads"
FIRESTORE_DATABASE: "(default)"

# Where the browser loads the frontend from. Update after the frontend has a URL:
#   gcloud run services update croplytix-api --region us-central1 \
#     --update-env-vars CORS_ORIGINS=https://your-frontend-url
CORS_ORIGINS: "http://localhost:3000,http://localhost:5173"

# Cloud Run rejects HTTP/1 requests over 32 MiB at the gateway; stay under it.
MAX_UPLOAD_MB: "30"
