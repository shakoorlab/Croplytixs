# Environment for the Cloud Run service. Passed with:
#   gcloud run deploy croplytix-api --env-vars-file deploy/env.cloudrun.yaml ...
#
# Same variable names as .env.example — only the values differ. A YAML file is
# used instead of --set-env-vars because that flag splits on commas, and
# CORS_ORIGINS may need commas.
#
# Every value must be a YAML *string*; quote anything that looks like a number.
# Replace the two REPLACE_ME values before deploying.

STORAGE_BACKEND: "gcs"
DB_BACKEND: "firestore"

GCP_PROJECT: "not-croplytixs"
GCS_BUCKET: "croplytix-not-croplytixs-uploads"
FIRESTORE_DATABASE: "(default)"

# Whose sign-ins the API trusts: Identity Platform ID tokens must name this
# project in their `aud` claim.
AUTH_PROJECT_ID: "not-croplytixs"

# Where the browser loads the frontend from. Update after the frontend has a URL:
#   gcloud run services update croplytix-api --region us-central1 \
#     --update-env-vars CORS_ORIGINS=https://your-frontend-url
CORS_ORIGINS: "http://localhost:3000,http://localhost:5173"

# The largest files the API opens an upload session for. The browser sends the
# bytes straight to the bucket, so Cloud Run's 32 MiB request limit doesn't apply;
# the ortho's ceiling is the memory the ingest job has (docs/gcp-setup.md, step 10).
MAX_ORTHO_MB: "10240"
MAX_SHAPEFILE_MB: "100"

# Ingest (orthophoto → COGs) runs as the Cloud Run job croplytix-ingest, never
# inside the API. Create the job first: docs/gcp-setup.md, step 10.
INGEST_RUNNER: "cloudrun"
INGEST_JOB: "croplytix-ingest"
INGEST_REGION: "us-central1"
VIEW_COMPRESSION: "WEBP"
# Read by the ingest job only: where its Cloud Storage volume mounts the bucket,
# so it reads each ortho in place. If the job has no mount, ingest copies the
# ortho instead and still works. The API ignores this.
INGEST_SOURCE_DIR: "/mnt/uploads"

# Processing (canopy per plot) runs as the Cloud Run job croplytix-process, in
# INGEST_REGION. Ingest starts it when it has built a flight's COGs, if the
# flight has a plot grid. Create the job first: docs/gcp-setup.md, step 13.
PROCESS_RUNNER: "cloudrun"
PROCESS_JOB: "croplytix-process"
PROCESS_AFTER_INGEST: "true"
# The job's --task-timeout and the largest field it takes on (millions of
# pixels at the model's 2.3 cm); see app/settings.py.
PROCESS_TIMEOUT_MINUTES: "60"
PROCESS_MAX_MEGAPIXELS: "150"
